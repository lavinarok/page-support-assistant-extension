<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Page Support Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
  <main class="container">
    <header>
      <h1>Page Support Assistant</h1>
      <p>
        Analise conteúdos selecionados diretamente da página.
      </p>
    </header>

    <section class="card">
      <h2>Texto selecionado</h2>

      <p
        id="selected-text"
        class="selected-text"
      >
        Selecione um texto em uma página e use o botão direito.
      </p>
    </section>

    <section
      id="source-section"
      class="source"
      hidden
    >
      <span>Origem</span>
      <a
        id="page-url"
        href="#"
        target="_blank"
        rel="noreferrer"
      ></a>
    </section>

    <section class="actions">
      <button
        id="summarize-button"
        type="button"
        disabled
      >
        Resumir
      </button>

      <button
        id="explain-button"
        type="button"
        disabled
      >
        Explicar
      </button>

      <button
        id="suggest-reply-button"
        type="button"
        disabled
      >
        Sugerir resposta
      </button>
    </section>

    <section
      id="result-section"
      class="card result-card"
      hidden
    >
      <h2 id="result-title">Resultado</h2>

      <p
        id="result-content"
        class="result-content"
      ></p>

      <button
        id="insert-reply-button"
        class="insert-reply-button"
        type="button"
        hidden
      >
        Inserir na página
      </button>
      
    </section>

    <p class="hint">
      A análise é processada pelo backend configurado para o projeto.
    </p>
  </main>

  <script
    type="module"
    src="sidepanel.js"
  ></script>
</body>
</html>
